<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">ReaperCode</title>
  <desc id="desc">ReaperCode wordmark with an abstract violet scythe on a black background.</desc>

  <defs>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="0.18" stop-color="#c4b5fd"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="0.82" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.22" stop-color="#ddd6fe"/>
      <stop offset="0.66" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#3b0764"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#6d28d9" stop-opacity=".10"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="tinyGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="520" rx="34" fill="#000"/>
  <ellipse cx="805" cy="276" rx="650" ry="260" fill="url(#aura)"/>

  <!-- abstract scythe -->
  <g transform="translate(170 36) rotate(-7 250 230)">
    <path d="M332 64
             C244 105 169 180 132 270
             C109 324 104 374 117 423"
          fill="none" stroke="#4c1d95" stroke-width="34" stroke-linecap="round" opacity=".9"/>
    <path d="M336 60
             C251 103 180 179 145 271
             C124 326 120 375 131 419"
          fill="none" stroke="url(#violet)" stroke-width="12" stroke-linecap="round" filter="url(#tinyGlow)"/>

    <path d="M330 67
             C456 16 606 14 745 58
             C635 80 535 130 462 205
             C412 157 367 111 330 67 Z"
          fill="url(#blade)" opacity=".98" filter="url(#softGlow)"/>
    <path d="M365 82
             C468 47 565 46 660 65
             C575 90 505 127 454 177"
          fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="3"/>

    <path d="M128 425 L105 460 L153 448 Z" fill="#7c3aed"/>
  </g>

  <!-- particles -->
  <g fill="#a78bfa">
    <circle cx="470" cy="101" r="3" opacity=".8"/>
    <circle cx="512" cy="78" r="2" opacity=".55"/>
    <circle cx="553" cy="116" r="2.5" opacity=".7"/>
    <circle cx="621" cy="92" r="2" opacity=".6"/>
    <circle cx="1264" cy="157" r="2.5" opacity=".6"/>
    <circle cx="1310" cy="194" r="2" opacity=".75"/>
    <circle cx="1351" cy="174" r="1.8" opacity=".5"/>
  </g>

  <!-- wordmark -->
  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="760">
    <text x="515" y="305" font-size="126" letter-spacing="-6" fill="#f4f4f5">Reaper</text>
    <text x="1014" y="305" font-size="126" letter-spacing="-6" fill="url(#violet)">Code</text>
  </g>

  <!-- deliberate cut marks -->
  <path d="M730 239 H877" stroke="#000" stroke-width="8" opacity=".92"/>
  <path d="M1080 331 H1240" stroke="#000" stroke-width="7" opacity=".9"/>
  <path d="M973 218 L1004 218" stroke="#8b5cf6" stroke-width="4" opacity=".8"/>

  <text x="522" y="366"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="22" letter-spacing="7" fill="#71717a">CODING AGENT RUNTIME</text>

  <line x1="516" y1="402" x2="1330" y2="402" stroke="#27272a" stroke-width="1"/>
  <line x1="516" y1="402" x2="812" y2="402" stroke="#7c3aed" stroke-width="2" opacity=".9"/>
</svg>