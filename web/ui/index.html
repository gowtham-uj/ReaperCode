<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <!-- The brand mark cropped from the source artwork. The favicon is an .ico
         carrying 16/32/48 so the tab picks a real size rather than scaling a
         bitmap down; the PNG is for everything that asks for a larger icon. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48 32x32 16x16" />
    <link rel="icon" href="/reaper-icon.png" type="image/png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Reaper</title>
  </head>
  <!-- The DeepSeek token sheet keeps light values on bare `body` and gates the
       whole dark palette behind `data-ds-dark-theme`; Reaper's accent themes add
       `data-ds-black-theme` or `data-ds-reaper-theme` on top. All are applied by
       this inline script rather than by the bundle, so the first paint is
       already the chosen theme instead of flashing dark and then switching.
       Kept in sync with src/theme.ts (storage key `reaper.theme`, values
       "dark" / "black" / "reaper"). The values are listed here rather than
       derived, because this script runs before any module loads and must not
       wait on the bundle to know what a valid theme is. The initial value is
       `reaper`, matching DEFAULT_THEME there, so a browser with no stored
       preference gets the product's own palette instead of the blue one. -->
  <body>
    <script>
      (function () {
        var theme = "reaper";
        try {
          var stored = localStorage.getItem("reaper.theme");
          if (stored === "black" || stored === "reaper") theme = stored;
        } catch (error) {
          /* storage blocked — the default theme is still correct */
        }
        document.body.setAttribute("data-ds-dark-theme", "");
        if (theme === "black") document.body.setAttribute("data-ds-black-theme", "");
        if (theme === "reaper") document.body.setAttribute("data-ds-reaper-theme", "");
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
